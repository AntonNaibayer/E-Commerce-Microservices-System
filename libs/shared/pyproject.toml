[project]
name = "shared"
version = "0.1.0"
description = "Shared code across microservices: JWT auth, RabbitMQ event schemas"
readme = "README.md"
authors = [
    { name = "AntonNaibayer", email = "anton.naubayer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
