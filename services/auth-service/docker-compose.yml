# docker-compose.yml
services:
  auth-postgres:
    image: postgres:17
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    # Добавляем healthcheck, чтобы приложение не пыталось подключиться к БД, пока она не готова
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: auth-app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: auth-postgres
      DB_PORT: 5432
    env_file:
      - .env
    depends_on:
      auth-postgres:
        condition: service_healthy
    volumes:
      - ./keys:/project/keys:ro

volumes:
  auth_postgres_data: