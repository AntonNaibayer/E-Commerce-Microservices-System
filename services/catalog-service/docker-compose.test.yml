# docker-compose.test.yml
services:
  catalog-postgres-test:
    image: postgres:17
    container_name: catalog-postgres-test
    environment:
      POSTGRES_DB: catalog_test_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d catalog_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5