services:
  catalog-service:
    build:
      context: ../../
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=catalog-postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=catalog-redis
      - REDIS_PORT=6379
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASS=${REDIS_PASS}
      - REDIS_NAME=${REDIS_NAME}
      - ALGORITHM=${ALGORITHM}
      - PUBLIC_KEY_PATH=${PUBLIC_KEY_PATH}
      - public_key_text=${public_key_text}
    volumes:
      - ./app:/workspace/services/catalog-service/app
      - ./keys:/workspace/services/catalog-service/keys
      - ../../libs:/workspace/libs
    depends_on:
      catalog-postgres:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy

  catalog-postgres:
    image: postgres:17
    container_name: catalog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-redis:
    image: redis:latest
    container_name: catalog-redis
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASS: ${REDIS_PASS}  # ✅ Изменили на REDIS_PASS
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redisdata:/data
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default off" > /usr/local/etc/redis/users.acl &&
        echo "user $$REDIS_USER on >$$REDIS_PASS ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user \"$$REDIS_USER\" --pass \"$$REDIS_PASS\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  catalog_postgres_data: